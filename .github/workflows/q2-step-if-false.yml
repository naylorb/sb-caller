name: "Q2 step-if-false-unpinned"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - trigger-q.txt
permissions:
  contents: read
jobs:
  case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: ${{ false }}
        uses: actions/setup-node@v4
