name: "Q1 job-if-false-unpinned"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - trigger-q.txt
permissions:
  contents: read
jobs:
  good:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
  skipped:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
